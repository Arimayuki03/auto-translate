name: Build Extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新推送取消仍在跑的旧 run，避免排队与浪费
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # node 24 自带 npm 11，与本地开发环境一致：lockfile 由 npm 11 生成，
      # npm 10（node 20 自带）校验会重算出缺失的可选 peer 边（esbuild@0.28.x）
      # 而判 lockfile 不同步——见 5c39931 与 2026-09-21 红灯，勿降回 node 20
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # e2e（tests/e2eSmoke.test.ts）加载 dist/ 扩展：build 必须先于 test，
      # 且 CI 需要 chromium；dist 被 gitignore，不 build 则 e2e 只会 skip
      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      # 防「静默 skip」回归：上面的 npm test 里若守卫条件意外不满足（如 chromium 装失败、
      # dist 缺失），e2eSmoke 只会 skip 而报告照绿。此步在 CI_ASSERT_E2E=1 下重跑该文件，
      # 守卫条件不满足时直接 throw（见 tests/e2eSmoke.test.ts canRunE2e），保证
      # e2e 在 CI 上要么真实运行、要么本步 exit code 非零让整个 workflow 变红。
      - name: Assert e2e actually ran
        run: npx vitest run tests/e2eSmoke.test.ts
        env:
          CI_ASSERT_E2E: "1"

      - name: Package zip
        run: node scripts/zip.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-translate-extension
          path: release/*.zip
          retention-days: 14
          if-no-files-found: error
